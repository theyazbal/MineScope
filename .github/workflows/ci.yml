name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check minescope tests
      - name: Test with coverage
        run: python -m pytest --cov=minescope --cov-report=term-missing
      - name: Test without optional dependencies (standard-library fallback)
        run: |
          python -m pip uninstall -y rich
          python -m unittest discover -s tests -t .
